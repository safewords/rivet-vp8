name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. CI is
# x86-64 Linux only. No Windows, macOS or arm64 jobs: the code stays
# portable, and the NEON (aarch64) paths are checked by hand on ARM hardware
# (README, "NEON on ARM hardware").

# id-token: a push to develop or main shows the compile cache's broker its
# OIDC token to be allowed to write the cache (ci-cache-setup).
permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The SIMD kernels are checked bit for bit against the scalar
          # ones: AVX2 on x86-64 (NEON is checked by hand on ARM hardware,
          # see the README).
          # VP8_REQUIRE_SIMD makes the kernel tests fail, rather than skip,
          # if a runner ever lacks that rung — a skipped kernel test would
          # look like a passing one.
          - { name: linux x86-64 (AVX2),   os: safewords-runners }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      # The test vectors' MD5s, every frame of all eighteen committed
      # streams (on 1 and 3 threads); the encoder round trips (1 and 4
      # threads); the kernels against their scalar references.
      - name: Tests (SIMD kernels)
        run: cargo test --release
        env:
          VP8_REQUIRE_SIMD: "1"
      - name: Tests (scalar kernels)
        run: cargo test --release
        env:
          VP8_FORCE_SCALAR: "1"
      - name: Property tests with overflow checks (debug)
        run: cargo test --test fuzz

  # The other 44 public VP8 test vectors (about 3 MB), downloaded from the
  # WebM project's test-data bucket, decoded with the SIMD kernels and with
  # the scalar ones. Without the download the test skips;
  # VP8_REQUIRE_VECTORS makes a missing set a failure here.
  vectors:
    name: test vectors (62 streams, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-64, os: safewords-runners }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - uses: actions/cache@v4
        with:
          path: tests/vectors
          key: vp8-vectors-${{ hashFiles('tools/vectors.txt') }}
      - run: bash tools/fetch-vectors.sh
      - name: Every vector, every frame's MD5 (SIMD kernels)
        run: cargo test --release --test vectors -- --nocapture
        env:
          VP8_REQUIRE_VECTORS: "1"
          VP8_REQUIRE_SIMD: "1"
      - name: Every vector, every frame's MD5 (scalar kernels)
        run: cargo test --release --test vectors -- --nocapture
        env:
          VP8_REQUIRE_VECTORS: "1"
          VP8_FORCE_SCALAR: "1"

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo build --release

  lint:
    name: clippy, rustfmt and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # rivet's compile cache, warmed with this commit before rivet's submodule is
  # bumped to it: the commit built inside rivet exactly as rivet's CI builds
  # it (safewords/rivet-transcoder .github/workflows/codec-cache-warmup.yml).
  # Never fails this workflow.
  rivet-cache:
    name: warm rivet's compile cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: safewords/rivet-transcoder/.github/workflows/codec-cache-warmup.yml@develop
    with:
      crates: rivet-vp8
      submodule: crates/vp8
