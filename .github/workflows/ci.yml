name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. arm64 is
# covered on the same x86-64 runners: cross-compiled for
# aarch64-unknown-linux-gnu and run under QEMU's user-mode emulator, so the
# NEON kernels are still checked against the scalar ones. No Windows or macOS
# CI: the code stays portable, but nothing here tests it there.

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The SIMD kernels are checked bit for bit against the scalar
          # ones on every host: AVX2 on x86-64, NEON on arm64.
          # VP8_REQUIRE_SIMD makes the kernel tests fail, rather than skip,
          # if a runner ever lacks that rung — a skipped kernel test would
          # look like a passing one.
          - { name: linux x86-64 (AVX2),   os: safewords-runners }
          - { name: linux arm64 (NEON) under QEMU,    os: safewords-runners, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: aarch64 cross toolchain and QEMU
        # The arm64 entry: cargo builds for aarch64-unknown-linux-gnu and runs
        # every test binary under qemu-aarch64. The runner image has these;
        # the install is a fallback for an image that predates them.
        if: matrix.target
        run: |
          if ! command -v qemu-aarch64 >/dev/null || ! command -v aarch64-linux-gnu-gcc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          fi
          {
            echo "CARGO_BUILD_TARGET=${{ matrix.target }}"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64 -L /usr/aarch64-linux-gnu"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      # The test vectors' MD5s, every frame of all eighteen committed
      # streams (on 1 and 3 threads); the encoder round trips (1 and 4
      # threads); the kernels against their scalar references.
      - name: Tests (SIMD kernels)
        run: cargo test --release
        env:
          VP8_REQUIRE_SIMD: "1"
      - name: Tests (scalar kernels)
        run: cargo test --release
        env:
          VP8_FORCE_SCALAR: "1"
      - name: Property tests with overflow checks (debug)
        run: cargo test --test fuzz

  # The other 44 public VP8 test vectors (about 3 MB), downloaded from the
  # WebM project's test-data bucket, decoded with the SIMD kernels and with
  # the scalar ones. Without the download the test skips;
  # VP8_REQUIRE_VECTORS makes a missing set a failure here.
  vectors:
    name: test vectors (62 streams, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-64, os: safewords-runners }
          - { name: arm64 under QEMU,  os: safewords-runners, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: aarch64 cross toolchain and QEMU
        # The arm64 entry: cargo builds for aarch64-unknown-linux-gnu and runs
        # every test binary under qemu-aarch64. The runner image has these;
        # the install is a fallback for an image that predates them.
        if: matrix.target
        run: |
          if ! command -v qemu-aarch64 >/dev/null || ! command -v aarch64-linux-gnu-gcc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          fi
          {
            echo "CARGO_BUILD_TARGET=${{ matrix.target }}"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64 -L /usr/aarch64-linux-gnu"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: tests/vectors
          key: vp8-vectors-${{ hashFiles('tools/vectors.txt') }}
      - run: bash tools/fetch-vectors.sh
      - name: Every vector, every frame's MD5 (SIMD kernels)
        run: cargo test --release --test vectors -- --nocapture
        env:
          VP8_REQUIRE_VECTORS: "1"
          VP8_REQUIRE_SIMD: "1"
      - name: Every vector, every frame's MD5 (scalar kernels)
        run: cargo test --release --test vectors -- --nocapture
        env:
          VP8_REQUIRE_VECTORS: "1"
          VP8_FORCE_SCALAR: "1"

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  lint:
    name: clippy (x86-64, aarch64), rustfmt and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: clippy for aarch64 (the NEON kernels)
        run: cargo clippy --all-targets --target aarch64-unknown-linux-gnu -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
